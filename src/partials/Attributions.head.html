<style>
  .team-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap:18px; margin: 20px 0 10px; }
  .team-card{
    position:relative; aspect-ratio: 3/4; border-radius: var(--radius-md); overflow:hidden;
    background: linear-gradient(160deg, #1a2224, #0b0f10);
  }
  /* Real portrait, filling the 3/4 card behind the name plate and overlay. */
  .team-card .tc-photo{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block;
  }
  .team-card .photo-ph{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background: var(--ph-bg); color: rgba(244,236,216,0.55); font-size:0.78rem; font-weight:600;
  }
  .team-card .name-plate{
    position:absolute; left:0; right:0; bottom:0; padding: 10px 12px;
    background: linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color:#fff; transition: opacity 0.25s;
  }
  .team-card .tc-name{ font-family:var(--font-display); font-weight:700; font-size:1.02rem; }
  .team-card .tc-role{ font-size:0.72rem; color: var(--kingfisher-3); }
  .team-card .info-overlay{
    position:absolute; inset:0; padding:16px; background: rgba(11,15,16,0.94); color: var(--text-on-dark);
    opacity:0; transform: translateY(10px); transition: opacity 0.28s, transform 0.28s; overflow-y:auto;
  }
  .team-card:hover .info-overlay, .team-card:focus-within .info-overlay{ opacity:1; transform:none; }
  /* The cards carry tabindex="0" so the overlay is reachable without a mouse;
     give that focus a visible ring (the :focus-within rule above then reveals
     the contribution text exactly as hovering does). */
  .team-card:focus-visible{ outline:3px solid var(--kingfisher-3); outline-offset:2px; }
  .team-card:hover .name-plate{ opacity:0; }
  .info-overlay .tc-name2{ font-family:var(--font-display); font-weight:700; font-size:1.05rem; color: var(--cream-glow-lit); }
  .info-overlay .tc-role2{ font-size:0.74rem; color: var(--kingfisher-3); margin-bottom:10px; }
  .info-overlay .tc-k{ font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color: var(--text-on-dark-dim); font-weight:700; margin-top:8px; }
  .info-overlay .tc-v{ font-size:0.82rem; line-height:1.4; }
  .info-overlay .tc-v.quote{ font-style:italic; color: var(--text-on-dark-dim); }
  .section-note{ font-size:0.85rem; color: var(--text-mid); max-width:720px; }
</style>
