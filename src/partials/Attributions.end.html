<script>
// Generate placeholder cards for sections without real roster data yet.
(function(){
  function card(role, idx){
    return '<div class="team-card">' +
      '<div class="photo-ph">Photo</div>' +
      '<div class="name-plate"><div class="tc-name">Team Member</div><div class="tc-role">' + role + '</div></div>' +
      '<div class="info-overlay">' +
        '<div class="tc-name2">Team Member ' + idx + '</div><div class="tc-role2">' + role + '</div>' +
        '<div class="tc-k">Contribution</div><div class="tc-v">TODO: one or two sentences on what this person actually did.</div>' +
        '<div class="tc-k">What others say</div><div class="tc-v quote">TODO: a short peer quote.</div>' +
      '</div></div>';
  }
  function fill(id, role, count){
    var el = document.getElementById(id);
    if (!el) return;
    var html = "";
    for (var i = 1; i <= count; i++) html += card(role, i);
    el.innerHTML = html;
  }
  fill("wet-grid", "Wet Lab", 10);
  fill("hp-grid", "Human Practices", 6);
  fill("advisor-grid", "Advisor", 3);
  fill("pi-grid", "Principal Investigator", 2);
})();
</script>
