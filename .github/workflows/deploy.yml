# Build the Astro site and publish it to GitHub Pages.
#
# Enable it once, in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". No branch to choose; this workflow is the source.
#
# withastro/action installs from the lockfile, runs `astro build`, and uploads dist/ as
# the Pages artifact. Nothing here needs to know the site's URL: every asset is referenced
# relatively, so the same artifact works at a project-site prefix (/repo/) or at a domain
# root without rebuilding.
name: Deploy to GitHub Pages

# PUBLISHING IS PAUSED. The push trigger is commented out deliberately, so that work can
# carry on landing on main without any of it reaching the public URL. Nothing else here is
# changed, and nothing is lost: to publish again, uncomment the two lines below, or just run
# this workflow by hand from the Actions tab, which still works exactly as before.
#
# Taking the LIVE site down is a separate thing and cannot be done from here — it needs
# Settings -> Pages -> Unpublish site on github.com. Pausing this only stops new deploys;
# whatever was last published stays served until that button is pressed.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:      # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a push during a deploy still
# ends up published rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # Pinned, and not left to the action's default of 20: astro 7.3.1 declares
          # engines.node ">=22.12.0", so a Node 20 runner fails the build outright. 24 is
          # what this is developed and verified against, and it leaves room above Astro's
          # floor rather than sitting exactly on it.
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
