# Build the Astro site and publish it to GitHub Pages.
#
# Enable it once, in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". No branch to choose; this workflow is the source.
#
# THAT SETTING IS NOT PERMANENT. Unpublishing the site and publishing it again puts Source
# back to "Deploy from a branch", and GitHub then runs its built-in Jekyll builder over the
# repository ROOT on every push, alongside this workflow. It fails, every time, because the
# --- fences at the top of an .astro file look like YAML front matter and what is inside them
# is TypeScript: "Invalid YAML front matter in src/pages/Project-Description.astro".
#
# Do not fix that error. The failure is the only thing keeping it harmless — a Jekyll build
# that SUCCEEDED would publish a rendering of the source tree and bury the real site. Adding
# .nojekyll would do exactly that. The fix is to put Source back to "GitHub Actions", which
# stops the builder being triggered at all.
#
# withastro/action installs from the lockfile, runs `astro build`, and uploads dist/ as
# the Pages artifact. Nothing here needs to know the site's URL: every asset is referenced
# relatively, so the same artifact works at a project-site prefix (/repo/) or at a domain
# root without rebuilding.
name: Deploy to GitHub Pages

# PUBLISHING IS LIVE AGAIN. main deploys itself: every push to it replaces the public site.
# It was paused for a while — the two push lines below were commented out — so that work
# could land on main without reaching the public URL. That pause is over, which means there
# is no longer any such thing as a private commit on this branch. Work that is not ready for
# the world goes on another branch.
#
# Taking the LIVE site down is a separate thing and cannot be done from here — it needs
# Settings -> Pages -> Unpublish site on github.com. Commenting these lines out again only
# stops new deploys; whatever was last published stays served until that button is pressed.
on:
  push:
    branches: [main]
  workflow_dispatch:      # and it can still be run by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a push during a deploy still
# ends up published rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # Pinned, and not left to the action's default of 20: astro 7.3.1 declares
          # engines.node ">=22.12.0", so a Node 20 runner fails the build outright. 24 is
          # what this is developed and verified against, and it leaves room above Astro's
          # floor rather than sitting exactly on it.
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
